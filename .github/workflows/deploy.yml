name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage static site files
        run: |
          rm -rf _site
          mkdir -p _site/app/src/main/res/drawable
          cp index.html manifest.json sw.js _site/
          if [ -f .nojekyll ]; then cp .nojekyll _site/; else touch _site/.nojekyll; fi
          if [ -f app/src/main/res/drawable/synapse_logo_1781452080476.jpg ]; then
            cp app/src/main/res/drawable/synapse_logo_1781452080476.jpg _site/app/src/main/res/drawable/
          fi
          ls -la _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: './_site'
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
